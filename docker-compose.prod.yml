version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: marketplace-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root_production_password}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_TMN_db}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ecommerce_TMN_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-cache:
    image: redis:7-alpine
    container_name: marketplace-redis-prod
    restart: always
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marketplace-backend-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-root_production_password}@postgres-db:5432/${POSTGRES_DB:-ecommerce_TMN_db}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-root_production_password}@postgres-db:5432/${POSTGRES_DB:-ecommerce_TMN_db}?schema=public
      REDIS_URL: redis://redis-cache:6379
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_min_32_characters_long}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BACKOFFICE_URL: ${BACKOFFICE_URL:-http://localhost:3001}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-dummy_cloud}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-dummy_key}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-dummy_secret}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dummy_id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dummy_secret}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:4000/api/auth/google/callback}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "4000:4000"
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy

  storefront:
    build:
      context: ./frontend-storefront
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    container_name: marketplace-storefront-prod
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backoffice:
    build:
      context: ./frontend-backoffice
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
    container_name: marketplace-backoffice-prod
    restart: always
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  pgdata_prod:
  redisdata_prod:
